# 安装 mkdocs-chess-plugin 后，可将本文件复制到站点根目录。
# 已有 MkDocs 配置时，将 chess 条目合并到现有的 plugins 列表中。
site_name: FEN 棋盘示例

plugins:
  - search
  - chess:
      # 候选：zh（中文）、en（英语）、ru（俄语）、vi（越南语）
      #       ko（韩语）、ja（日语）、de（德语）、fr（法语）
      language: zh

      # 两种棋类分别选择内置棋盘和棋子。省略的选项使用 default。
      defaults:
        xiang:
          # board 候选：default（经典）、wood（木纹）、green（青绿）
          board: wood
          # pieces 候选：default（经典）、ivory（象牙白）、ink（墨黑）、wood（木色）
          pieces: ivory
        chess:
          # board 候选：default（经典）、wood（木纹）、green（绿白格）
          board: green
          # pieces 候选：default（经典）、ivory（象牙白与深棕）、ink（黑白）
          pieces: ivory

      # 候选：chesscom（Chess.com）、tiantian（天天象棋）。省略时选 chesscom。
      sounds: chesscom

# 单个 Markdown 棋盘可用 board-<主题名> 和 pieces-<主题名> 覆盖站点默认值。
# 例如 ??? xiang board-green pieces-ink "FEN"
